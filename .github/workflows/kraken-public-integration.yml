name: Kraken Public Integration

on:
  push:
    branches:
      - fix/paper-gap-recovery
    paths:
      - "test_kraken_public_integration.py"
      - "market_data.py"
      - "test_run_bot_recovery.py"
      - "test_paper_gap_recovery.py"
      - "test_market_data_recovery.py"
      - "requirements.txt"
      - ".github/workflows/kraken-public-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-read-only-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated recovery branch
        uses: actions/checkout@v7.0.1
        with:
          ref: fix/paper-gap-recovery

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check recent candles and historical limit using public Kraken data
        run: python test_kraken_public_integration.py
