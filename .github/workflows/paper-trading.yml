name: Crypto Signals Paper Trading

on:
  push:
    branches:
      - paper-trading-v1-2
      - paper-trading-audit-v1
      - paper-trading-capital-v2
    paths:
      - "paper_bot.py"
      - "paper_trading.py"
      - "market_data.py"
      - "signal_engine.py"
      - "risk_manager.py"
      - "requirements.txt"
      - "test_*.py"
      - "paper_report.py"
      - ".github/workflows/paper-trading.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: paper-branch-data-writer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -v

      - name: Ejecutar simulador
        run: python paper_bot.py

      - name: Mostrar estadísticas por activo
        run: python paper_report.py

      - name: Guardar estado del simulador
        run: |
          python -c "from paper_trading import load_state, save_state; save_state(load_state())"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper_state.json
          git diff --cached --quiet || git commit -m "Update paper trading state"
          git push origin "HEAD:${{ github.ref_name }}"
