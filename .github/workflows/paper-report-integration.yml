name: Paper Report Integration Validation

on:
  push:
    branches:
      - paper-report-integration-validation
  pull_request:
    branches:
      - paper-report-dashboard-bridge

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run end-to-end report integration tests
        run: python -m unittest -v test_paper_report_integration.py
