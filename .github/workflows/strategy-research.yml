name: Strategy Historical Research

on:
  push:
    branches:
      - paper-trading-v1-2
    paths:
      - "strategy_research.py"
      - "test_strategy_research.py"
      - ".github/workflows/strategy-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout paper branch
        uses: actions/checkout@v4
        with:
          ref: paper-trading-v1-2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run research unit tests
        run: |
          python -m unittest -v test_strategy_research

      - name: Run historical parameter comparison
        run: |
          python strategy_research.py

      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: strategy-research-report
          path: strategy_research_report.json
          if-no-files-found: error
          retention-days: 14
