name: Kraken Market History Archive (Paper Branch)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: paper-branch-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout paper trading branch
        uses: actions/checkout@v4
        with:
          ref: paper-trading-v1-2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test collector
        run: python -m unittest -v test_market_history_collector

      - name: Collect closed Kraken candles
        run: python market_history_collector.py

      - name: Test market history audit
        run: python -m unittest -v test_market_history_audit

      - name: Audit archived market history
        run: python market_history_audit.py

      - name: Run fee-aware historical strategy research
        run: python strategy_research.py

      - name: Upload market and strategy research report
        uses: actions/upload-artifact@v4
        with:
          name: market-history-and-strategy-research
          path: strategy_research_report.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit market history to paper branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_history/
          git diff --cached --quiet || git commit -m "Archive closed Kraken market candles"
          git push origin HEAD:paper-trading-v1-2
