name: Kraken Out-of-Sample Validation
on:
  push:
    branches: [paper-kraken-out-of-sample-validation]
    paths:
      - "historical_oos_validation.py"
      - "test_historical_oos_validation.py"
      - "historical_segment_backtest.py"
      - "kraken_selective_csv_extractor.py"
      - ".github/workflows/kraken-out-of-sample-validation.yml"
  pull_request:
    branches: [paper-kraken-historical-backtest]
    paths:
      - "historical_oos_validation.py"
      - "test_historical_oos_validation.py"
      - "historical_segment_backtest.py"
      - "kraken_selective_csv_extractor.py"
      - ".github/workflows/kraken-out-of-sample-validation.yml"
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas>=2.2.0"
      - run: python -m unittest -v test_historical_oos_validation.py test_historical_segment_backtest.py
  live-out-of-sample:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas>=2.2.0"
      - name: Extract verified Kraken history and run chronological OOS validation
        run: python kraken_selective_csv_extractor.py
