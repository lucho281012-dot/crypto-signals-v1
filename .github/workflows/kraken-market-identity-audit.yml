name: Kraken Market Identity Audit
on:
  push:
    branches: [paper-kraken-market-identity-audit]
  pull_request:
    branches: [paper-kraken-historical-data-validation]
    paths:
      - "kraken_market_identity.py"
      - "test_kraken_market_identity.py"
      - ".github/workflows/kraken-market-identity-audit.yml"
jobs:
  market-identity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test exact Kraken spot market identity checks
        run: python -m unittest -v test_kraken_market_identity.py
