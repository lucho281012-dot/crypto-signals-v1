name: Legacy Paper Report Adapter

on:
  pull_request:
    branches:
      - paper-trading-v1-2
    paths:
      - "paper_legacy_report_adapter.py"
      - "test_paper_legacy_report_adapter.py"
      - ".github/workflows/legacy-paper-report-adapter.yml"
  push:
    branches:
      - paper-legacy-report-adapter
    paths:
      - "paper_legacy_report_adapter.py"
      - "test_paper_legacy_report_adapter.py"
      - ".github/workflows/legacy-paper-report-adapter.yml"

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete project test suite
        run: python -m unittest discover -v
