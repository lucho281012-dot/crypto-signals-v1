name: Legacy Paper Report Adapter

on:
  pull_request:
    branches:
      - paper-trading-v1-2
    paths:
      - "paper_legacy_report_adapter.py"
      - "test_paper_legacy_report_adapter.py"
      - ".github/workflows/legacy-paper-report-adapter.yml"
  push:
    branches:
      - paper-legacy-report-adapter
    paths:
      - "paper_legacy_report_adapter.py"
      - "test_paper_legacy_report_adapter.py"
      - ".github/workflows/legacy-paper-report-adapter.yml"

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run adapter tests
        run: python -m unittest -v test_paper_legacy_report_adapter.py
