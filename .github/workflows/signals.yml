
name: Crypto Signals

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-signals-main
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar conexión OKX
        run: python test_okx.py

      - name: Ejecutar bot de señales
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_once.py

      - name: Evaluar señales anteriores
        run: python track_signals.py

      - name: Guardar estado e historial
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/state.json data/signals_history.json || true

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estado e historial de señales"
          fi

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
