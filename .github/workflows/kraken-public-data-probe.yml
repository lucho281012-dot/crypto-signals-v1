name: Kraken Public Market Data Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kraken-public-market-data-probe
  cancel-in-progress: false

jobs:
  public-readonly-probe:
    name: Check public Kraken ticker and OHLCV data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout transaction-safety candidate
        uses: actions/checkout@v4
        with:
          ref: paper-trading-transaction-safety
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Query public Kraken market data only
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import time
          import ccxt

          symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
          exchange = ccxt.kraken({"enableRateLimit": True})
          exchange.load_markets()

          server_ms = exchange.fetch_time()
          local_ms = int(time.time() * 1000)
          print(f"CCXT_VERSION={ccxt.__version__}")
          print(f"KRAKEN_SERVER_TIME={datetime.fromtimestamp(server_ms / 1000, timezone.utc).isoformat()}")
          print(f"LOCAL_SERVER_SKEW_MS={local_ms - server_ms}")

          failures = []
          for symbol in symbols:
              if symbol not in exchange.markets:
                  print(f"PAIR={symbol} AVAILABLE=false")
                  failures.append(f"{symbol}: market unavailable")
                  continue

              ticker = exchange.fetch_ticker(symbol)
              last = ticker.get("last")
              ts = ticker.get("timestamp")
              age = None if ts is None else local_ms - int(ts)
              print(
                  f"PAIR={symbol} AVAILABLE=true LAST={last} "
                  f"TICKER_TIMESTAMP={ts} TICKER_TIMESTAMP_PRESENT={ts is not None} "
                  f"TICKER_AGE_MS={age}"
              )
              if last is None or float(last) <= 0:
                  failures.append(f"{symbol}: ticker last missing or invalid")

              if ts is not None and (age < -60000 or age > 120000):
                  failures.append(f"{symbol}: ticker timestamp outside diagnostic freshness window")

              for timeframe in ("5m", "15m"):
                  rows = exchange.fetch_ohlcv(symbol, timeframe=timeframe, limit=3)
                  if not rows:
                      failures.append(f"{symbol} {timeframe}: no OHLCV rows")
                      print(f"OHLCV={symbol} TIMEFRAME={timeframe} ROWS=0")
                      continue
                  latest = rows[-1][0]
                  print(
                      f"OHLCV={symbol} TIMEFRAME={timeframe} ROWS={len(rows)} "
                      f"LATEST_TIMESTAMP={latest} LATEST_UTC="
                      f"{datetime.fromtimestamp(latest / 1000, timezone.utc).isoformat()}"
                  )

          if failures:
              raise SystemExit("PROBE_FAILURES: " + "; ".join(failures))

          print("PROBE_RESULT=PASS_PUBLIC_READ_ONLY_DATA_AVAILABLE")
          print("NOTE=Missing ticker timestamps are reported above; this probe does not change simulator code or state.")
          PY

      - name: Confirm working tree is unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
