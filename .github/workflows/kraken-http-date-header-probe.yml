name: Kraken HTTP Date Header Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kraken-http-date-header-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Inspect public Kraken ticker response headers
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout transaction-safety candidate
        uses: actions/checkout@v4
        with:
          ref: paper-trading-transaction-safety
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Query public Kraken ticker headers only
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          import time
          import ccxt

          symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
          exchange = ccxt.kraken({
              "enableRateLimit": True,
              "enableLastResponseHeaders": True,
          })
          exchange.load_markets()

          server_ms = exchange.fetch_time()
          local_ms = int(time.time() * 1000)
          print(f"CCXT_VERSION={ccxt.__version__}")
          print(f"KRAKEN_SERVER_TIME={datetime.fromtimestamp(server_ms / 1000, timezone.utc).isoformat()}")
          print(f"LOCAL_SERVER_SKEW_MS={local_ms - server_ms}")

          failures = []
          for symbol in symbols:
              if symbol not in exchange.markets:
                  print(f"PAIR={symbol} AVAILABLE=false")
                  failures.append(f"{symbol}: market unavailable")
                  continue

              request_start_ms = int(time.time() * 1000)
              ticker = exchange.fetch_ticker(symbol)
              request_end_ms = int(time.time() * 1000)
              headers = dict(exchange.last_response_headers or {})
              normalized = {str(k).lower(): v for k, v in headers.items()}
              date_header = normalized.get("date")
              age_header = normalized.get("age")
              cache_control = normalized.get("cache-control")
              cf_cache_status = normalized.get("cf-cache-status")
              last_modified = normalized.get("last-modified")
              last = ticker.get("last")

              date_ms = None
              date_error = None
              if date_header:
                  try:
                      parsed = parsedate_to_datetime(str(date_header))
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=timezone.utc)
                      date_ms = int(parsed.timestamp() * 1000)
                  except Exception as exc:
                      date_error = type(exc).__name__

              print(
                  f"PAIR={symbol} AVAILABLE=true LAST={last} "
                  f"HTTP_DATE={date_header} HTTP_DATE_EPOCH_MS={date_ms} "
                  f"HTTP_DATE_PARSE_ERROR={date_error} AGE={age_header} "
                  f"CACHE_CONTROL={cache_control} CF_CACHE_STATUS={cf_cache_status} "
                  f"LAST_MODIFIED={last_modified} "
                  f"REQUEST_START_MS={request_start_ms} REQUEST_END_MS={request_end_ms}"
              )

              if last is None or float(last) <= 0:
                  failures.append(f"{symbol}: ticker last missing or invalid")
              if not date_header or date_ms is None:
                  failures.append(f"{symbol}: missing or invalid HTTP Date header")
              else:
                  # Date has one-second precision. Allow a small diagnostic window
                  # around the request and the Kraken server-time sample.
                  if date_ms < request_start_ms - 10000 or date_ms > request_end_ms + 10000:
                      failures.append(f"{symbol}: HTTP Date outside request-time window")
                  if abs(date_ms - server_ms) > 30000:
                      failures.append(f"{symbol}: HTTP Date differs from Kraken server time by >30s")
              if age_header is not None:
                  try:
                      if float(age_header) > 2:
                          failures.append(f"{symbol}: cached response Age exceeds 2 seconds")
                  except (TypeError, ValueError):
                      failures.append(f"{symbol}: unparseable HTTP Age header")

          if failures:
              raise SystemExit("PROBE_FAILURES: " + "; ".join(failures))

          print("PROBE_RESULT=PASS_HTTP_DATE_HEADERS_PRESENT_AND_TIME_BOUNDED")
          print("NOTE=HTTP Date timestamps the HTTP response, not necessarily the underlying market quote; cache headers are reported for interpretation.")
          PY

      - name: Confirm working tree is unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
