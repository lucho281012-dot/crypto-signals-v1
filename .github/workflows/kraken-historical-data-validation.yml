name: Kraken Historical Data Validation
on:
  push:
    branches: [paper-kraken-historical-data-validation]
  pull_request:
    branches: [paper-strategy-backtest-integration]
    paths:
      - "kraken_ohlcvt.py"
      - "test_kraken_ohlcvt.py"
      - ".github/workflows/kraken-historical-data-validation.yml"
jobs:
  historical-data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Kraken OHLCVT importer and validator
        run: python -m unittest -v test_kraken_ohlcvt.py
