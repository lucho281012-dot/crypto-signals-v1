name: Entry Context Ledger Audit (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/paper-trading-entry-context-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated entry-context branch
        uses: actions/checkout@v7.0.1
        with:
          ref: paper-trading-entry-context-v1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Audit saved ledger without running the bot
        run: python paper_state_audit.py
      - name: Audit closed trades
        run: python trade_quality_audit.py
