name: Paper Entry Context Tests

on:
  push:
    branches:
      - paper-trading-entry-context-v1
    paths:
      - "signal_engine.py"
      - "paper_bot.py"
      - "test_signal_diagnostics.py"
      - "trade_quality_audit.py"
      - "test_trade_quality_audit.py"
      - ".github/workflows/entry-context-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated entry-context branch
        uses: actions/checkout@v7.0.1
        with:
          ref: paper-trading-entry-context-v1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run signal diagnostic and ledger tests
        run: python -m unittest -v test_signal_diagnostics.py test_trade_quality_audit.py
