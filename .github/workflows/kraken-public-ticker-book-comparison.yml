name: Kraken Public Ticker and Order Book Comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kraken-public-ticker-book-comparison
  cancel-in-progress: false

jobs:
  probe:
    name: Compare public ticker and best bid ask snapshots
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout transaction-safety candidate
        uses: actions/checkout@v4
        with:
          ref: paper-trading-transaction-safety
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install requests

      - name: Compare public ticker and Pre-Trade book only
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import math
          import time
          import requests
          import ccxt

          SYMBOLS = ["BTC/USD", "ETH/USD", "SOL/USD"]
          BASE_URL = "https://api.kraken.com/0/public/PreTrade"
          SAMPLES = 3
          PAUSE_SECONDS = 3
          exchange = ccxt.kraken({"enableRateLimit": True})
          exchange.load_markets()
          session = requests.Session()
          failures = []

          def number(value):
              try:
                  result = float(value)
              except (TypeError, ValueError, OverflowError):
                  return None
              return result if math.isfinite(result) else None

          def publication_ms(level):
              value = level.get("publication_ts")
              if not isinstance(value, str):
                  return None
              try:
                  dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  return None
              return dt.timestamp() * 1000

          def pct(a, b):
              if a is None or b is None or b == 0:
                  return None
              return abs(a - b) / b * 100

          server_ms = exchange.fetch_time()
          local_ms = int(time.time() * 1000)
          print(f"CCXT_VERSION={ccxt.__version__}")
          print("DATA_SOURCE=Kraken public REST ticker plus public Pre-Trade order book")
          print("AUTHENTICATION=none")
          print("ORDER_ACTIONS=none")
          print(f"KRAKEN_SERVER_TIME_UTC={datetime.fromtimestamp(server_ms / 1000, timezone.utc).isoformat()}")
          print(f"LOCAL_SERVER_SKEW_MS={local_ms - server_ms}")
          print(f"SAMPLES_PER_SYMBOL={SAMPLES} SAMPLE_PAUSE_SECONDS={PAUSE_SECONDS}")

          for symbol in SYMBOLS:
              if symbol not in exchange.markets:
                  failures.append(f"{symbol}: CCXT market unavailable")
                  print(f"PAIR={symbol} AVAILABLE=false")
                  continue

              for sample in range(1, SAMPLES + 1):
                  request_start_ms = int(time.time() * 1000)
                  try:
                      response = session.get(
                          BASE_URL,
                          params={"symbol": symbol},
                          headers={"Accept": "application/json"},
                          timeout=20,
                      )
                      book_received_ms = int(time.time() * 1000)
                      response.raise_for_status()
                      payload = response.json()
                      if payload.get("error"):
                          raise RuntimeError(f"Pre-Trade API error: {payload['error']}")
                      book = payload.get("result")
                      if not isinstance(book, dict) or book.get("symbol") != symbol:
                          raise RuntimeError("Unexpected Pre-Trade response structure")

                      bids = book.get("bids")
                      asks = book.get("asks")
                      if not isinstance(bids, list) or not bids or not isinstance(asks, list) or not asks:
                          raise RuntimeError("Missing bid or ask levels")
                      best_bid = bids[0]
                      best_ask = asks[0]
                      bid_price = number(best_bid.get("price"))
                      ask_price = number(best_ask.get("price"))
                      bid_qty = number(best_bid.get("qty"))
                      ask_qty = number(best_ask.get("qty"))
                      bid_ts = publication_ms(best_bid)
                      ask_ts = publication_ms(best_ask)
                      if (bid_price is None or ask_price is None or bid_price <= 0 or
                          ask_price <= 0 or ask_price < bid_price or bid_ts is None or ask_ts is None):
                          raise RuntimeError("Invalid best bid/ask price or publication timestamp")

                      ticker = exchange.fetch_ticker(symbol)
                      ticker_received_ms = int(time.time() * 1000)
                      last = number(ticker.get("last"))
                      ticker_bid = number(ticker.get("bid"))
                      ticker_ask = number(ticker.get("ask"))
                      ticker_ts = ticker.get("timestamp")
                      midpoint = (bid_price + ask_price) / 2
                      spread_pct = (ask_price - bid_price) / midpoint * 100
                      last_vs_mid_pct = pct(last, midpoint)
                      bid_age_ms = book_received_ms - bid_ts
                      ask_age_ms = book_received_ms - ask_ts

                      if last is None or last <= 0:
                          failures.append(f"{symbol} sample {sample}: ticker last missing or invalid")

                      print(
                          f"PAIR={symbol} SAMPLE={sample} "
                          f"BOOK_BID={bid_price} BOOK_BID_QTY={bid_qty} "
                          f"BOOK_BID_PUBLICATION_UTC={datetime.fromtimestamp(bid_ts / 1000, timezone.utc).isoformat()} "
                          f"BOOK_BID_AGE_AT_RECEIVE_MS={bid_age_ms} "
                          f"BOOK_ASK={ask_price} BOOK_ASK_QTY={ask_qty} "
                          f"BOOK_ASK_PUBLICATION_UTC={datetime.fromtimestamp(ask_ts / 1000, timezone.utc).isoformat()} "
                          f"BOOK_ASK_AGE_AT_RECEIVE_MS={ask_age_ms} "
                          f"BOOK_MID={midpoint} BOOK_SPREAD_PCT={spread_pct} "
                          f"TICKER_LAST={last} TICKER_BID={ticker_bid} TICKER_ASK={ticker_ask} "
                          f"TICKER_TIMESTAMP_MS={ticker_ts} "
                          f"TICKER_LAST_VS_BOOK_MID_DIFF_PCT={last_vs_mid_pct} "
                          f"TICKER_BID_VS_BOOK_BID_DIFF_PCT={pct(ticker_bid, bid_price)} "
                          f"TICKER_ASK_VS_BOOK_ASK_DIFF_PCT={pct(ticker_ask, ask_price)} "
                          f"REQUEST_START_MS={request_start_ms} BOOK_RECEIVED_MS={book_received_ms} "
                          f"TICKER_RECEIVED_MS={ticker_received_ms} "
                          f"HTTP_DATE={response.headers.get('Date')} HTTP_AGE={response.headers.get('Age')}"
                      )
                      if bid_age_ms < -10000 or ask_age_ms < -10000:
                          failures.append(f"{symbol} sample {sample}: best-level timestamp >10s in future")
                  except Exception as exc:
                      failures.append(f"{symbol} sample {sample}: {type(exc).__name__}: {exc}")
                      print(f"PAIR={symbol} SAMPLE={sample} ERROR={type(exc).__name__}: {exc}")

                  if sample < SAMPLES:
                      time.sleep(PAUSE_SECONDS)

          if failures:
              raise SystemExit("PROBE_FAILURES: " + "; ".join(failures))

          print("PROBE_RESULT=PASS_PUBLIC_TICKER_BOOK_COMPARISON")
          print("NOTE=Pre-Trade publication_ts is the last publication time for each individual price level, not a timestamp for the ticker last price or a globally synchronized snapshot. Ticker and book requests are sequential, so differences include request timing and market movement. This diagnostic does not authorize using midpoint as an executable fill price.")
          PY

      - name: Confirm working tree is unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
