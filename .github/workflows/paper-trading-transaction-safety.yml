name: Paper Trading Transaction Safety Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-trading-transaction-safety-tests
  cancel-in-progress: false

jobs:
  transaction-tests:
    name: Test atomic paper state updates without trading
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout transaction-safety candidate
        uses: actions/checkout@v4
        with:
          ref: paper-trading-transaction-safety
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run transaction-safety tests
        run: |
          python -m unittest -v test_paper_bot_transaction_safety.py

      - name: Confirm working tree is unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
