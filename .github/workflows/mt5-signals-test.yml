
name: MT5 Signals Data Test

on:
  push:
    branches:
      - mt5-signals-v1
    paths:
      - "data_feed.py"
      - "signal_rules.py"
      - "test_signal_rules.py"
      - ".github/workflows/mt5-signals-test.yml"
      - "analyze.py"
      - "historical_data.py"
      - "historical_snapshot.py"
      - "backtest.py"
      - "backtest_audit.py"
      - "market_conditions.py"
      - "walk_forward_audit.py"
      - "exit_audit.py"
      - "exit_parameter_test.py"
      - "entry_filter_audit.py"
      - "entry_outcome_audit.py"

jobs:
  test-data:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test signal rules
        run: python -m unittest -v test_signal_rules.py

      - name: Run BTC data analyzer
        run: python data_feed.py

      - name: Run integrated signal analyzer
        run: python analyze.py

      - name: Create shared historical snapshot
        run: python historical_snapshot.py

      - name: Verify shared historical snapshot
        run: python historical_data.py

      - name: Run historical backtest
        run: python backtest.py

      - name: Run BUY and SELL audit
        run: python backtest_audit.py

      - name: Analyze market conditions
        run: python market_conditions.py

      - name: Run walk forward robustness audit
        run: python walk_forward_audit.py

      - name: Run exit audit
        run: python exit_audit.py

      - name: Test exit parameters
        run: python exit_parameter_test.py

      - name: Run entry filter audit
        run: python entry_filter_audit.py

      - name: Run entry outcome audit
        run: python entry_outcome_audit.py
