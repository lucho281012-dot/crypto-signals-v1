name: Telegram Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probar Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage"
          response = requests.post(url, data={
              "chat_id": os.environ["CHAT_ID"],
              "text": "¡Crypto Signals V1.1 está conectado correctamente!"
          })
          result = response.json()

          if not result.get("ok"):
              raise SystemExit("Error al enviar mensaje. Revisa los secretos de Telegram.")

          print("Mensaje enviado correctamente.")
          PY
