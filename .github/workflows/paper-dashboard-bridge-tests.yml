name: Paper dashboard bridge tests

on:
  pull_request:
    branches:
      - paper-report-dashboard-bridge
  push:
    branches:
      - paper-state-readonly-bridge

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m unittest discover -v
